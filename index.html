          <button class="btn tiny gold" type="button" data-action="free-coins">+ Nhận xu</button>

        <p id="pf-country"></p><p id="pf-title" class="title-tag"></p><p id="pf-rank" class="rank-tag"></p><p id="pf-age" class="muted"></p>
        <div class="xp-row wide"><span id="pf-level" class="lv">Lv.1</span><div class="xp-bar"><i id="pf-xp-fill"></i></div></div>

        <button class="btn small" type="button" data-action="edit-country"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Đổi quốc gia</button>
        <button class="btn small" type="button" data-action="edit-age"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s2-1 4-1 4 1 4 1 2-1 4-1 4 1 4 1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><circle cx="7" cy="4" r="1"/><circle cx="12" cy="4" r="1"/><circle cx="17" cy="4" r="1"/></svg>Đổi tuổi</button>
      </div>
      <div id="pf-grid" class="stat-grid"></div>
    </section>

    <!-- THỐNG KÊ -->
    <section class="screen" id="screen-stats" aria-label="Thống kê">
      <div id="stats-grid" class="stat-grid"></div>
      <h3 class="sub">Theo từng game</h3>
      <div id="stats-games" class="table-rows"></div>
      <div id="stats-bars" class="bars"></div>

    <!-- THÀNH TÍCH -->
    <section class="screen" id="screen-achievements" aria-label="Thành tích">
      <p id="ach-count" class="muted center"></p>

    <section class="screen" id="screen-guide" aria-label="Hướng dẫn">
