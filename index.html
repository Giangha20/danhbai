<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Card Master</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Master">
<meta name="theme-color" content="#062a1e">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%230a3a2a'/%3E%3Crect x='32' y='20' width='50' height='72' rx='7' fill='%23fffdf8' stroke='%23c9a24a' stroke-width='3' transform='rotate(-12 60 60)'/%3E%3Ctext x='56' y='76' font-size='40' text-anchor='middle' fill='%2315171c' transform='rotate(-12 60 60)'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%230a3a2a'/%3E%3Ctext x='60' y='84' font-size='70' text-anchor='middle' fill='%23fffdf8'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
<script>
/* Áp dụng theme trước khi vẽ để không bị nháy giao diện */
(function(){try{var d=JSON.parse(localStorage.getItem('offline_card_master_v1')||'{}');var t=(d.settings&&d.settings.theme)||'dark';
if(t==='system'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(e){}})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="home">
<noscript><p style="padding:24px;color:#fff">Card Master cần bật JavaScript để chơi.</p></noscript>

<div id="loading" role="status" aria-live="polite">
  <div id="loading-logo" class="loading-logo"></div>
  <h1>CARD MASTER</h1>
  <p>Loading...</p>
</div>

<div id="app" hidden>
  <header id="topbar">
    <button id="btn-back" class="icon-btn" type="button" data-action="back" aria-label="Quay lại" hidden>‹</button>
    <h1 id="screen-title">CARD MASTER</h1>
    <div class="top-actions">
      <button id="btn-sound" class="icon-btn" type="button" data-action="toggle-sound" aria-label="Bật/tắt âm thanh" aria-pressed="true">🔊</button>
      <button class="icon-btn" type="button" data-action="goto" data-target="settings" aria-label="Cài đặt">⚙️</button>
    </div>
  </header>

  <main id="main">
    <!-- TRANG CHỦ -->
    <section class="screen active" id="screen-home" aria-label="Trang chủ">
      <div class="home-hero">
        <div id="home-logo" class="home-logo" aria-hidden="true"></div>
        <h2 class="brand">CARD MASTER</h2>
        <div class="profile-card">
          <div id="home-avatar" class="avatar-lg" aria-hidden="true">👨</div>
          <div class="pc-info">
            <b id="home-name">Minh</b>
            <span id="home-country">🇻🇳 Việt Nam</span>
            <div class="xp-row"><span id="home-level" class="lv">Lv.12</span>
              <div class="xp-bar"><i id="home-xp-fill"></i></div></div>
            <small id="home-xp-text"></small>
          </div>
        </div>
        <button id="btn-play-now" class="btn primary big" type="button" data-action="play-now">🎴 CHƠI NGAY</button>
      </div>
      <nav class="menu-grid" aria-label="Menu chính">
        <button class="menu-item" type="button" data-action="goto" data-target="games"><span>🎴</span>CHƠI GAME</button>
        <button class="menu-item" type="button" data-action="goto" data-target="tournament"><span>🏆</span>GIẢI ĐẤU</button>
        <button class="menu-item" type="button" data-action="goto" data-target="rooms"><span>🏟️</span>PHÒNG</button>
        <button class="menu-item" type="button" data-action="goto" data-target="profile"><span>👤</span>HỒ SƠ</button>
        <button class="menu-item" type="button" data-action="goto" data-target="stats"><span>📊</span>THỐNG KÊ</button>
        <button class="menu-item" type="button" data-action="goto" data-target="achievements"><span>🏅</span>THÀNH TÍCH</button>
        <button class="menu-item" type="button" data-action="goto" data-target="settings"><span>⚙️</span>CÀI ĐẶT</button>
        <button class="menu-item" type="button" data-action="goto" data-target="guide"><span>📖</span>HƯỚNG DẪN</button>
      </nav>
    </section>

    <!-- CHỌN GAME -->
    <section class="screen" id="screen-games" aria-label="Chọn game">
      <div id="games-list" class="games-list"></div>
      <h3 class="sub">Sắp có</h3>
      <div id="games-locked" class="games-list"></div>
    </section>

    <!-- GIẢI ĐẤU -->
    <section class="screen" id="screen-tournament" aria-label="Giải đấu"><div id="tour-body"></div></section>

    <!-- PHÒNG -->
    <section class="screen" id="screen-rooms" aria-label="Phòng chơi"><div id="rooms-body"></div></section>

    <!-- MÀN CHƠI -->
    <section class="screen" id="screen-play" aria-label="Bàn chơi">
      <div id="play-bar">
        <button class="icon-btn" type="button" data-action="play-exit" aria-label="Thoát ván">‹</button>
        <div id="play-title"></div>
        <div id="turn-label" aria-live="polite"></div>
        <div id="timer-pill" aria-label="Thời gian còn lại"><i id="timer-bar"></i><span id="timer-num">—</span></div>
        <button class="icon-btn" type="button" data-action="play-rules" aria-label="Luật chơi">📖</button>
      </div>
      <div id="seats"></div>
      <div id="table">
        <div id="deck-pile" class="card back" aria-hidden="true"><img alt=""></div>
        <div id="table-info" aria-live="polite"></div>
        <div id="table-cards"></div>
      </div>
      <div id="my-info"></div>
      <div id="hand-wrap"><div id="hand" role="group" aria-label="Bài của bạn"></div></div>
      <div id="action-bar"></div>
    </section>

    <!-- HỒ SƠ -->
    <section class="screen" id="screen-profile" aria-label="Hồ sơ">
      <div class="pf-top">
        <div id="pf-avatar" class="avatar-xl">👨</div>
        <h2 id="pf-name">Minh</h2>
        <p id="pf-country"></p><p id="pf-age" class="muted"></p>
        <div class="xp-row wide"><span id="pf-level" class="lv">Lv.12</span><div class="xp-bar"><i id="pf-xp-fill"></i></div></div>
        <small id="pf-xp-text"></small>
      </div>
      <div class="pf-buttons">
        <button class="btn small" type="button" data-action="edit-name">✏️ Đổi tên</button>
        <button class="btn small" type="button" data-action="edit-avatar">🙂 Đổi avatar</button>
        <button class="btn small" type="button" data-action="edit-country">🌎 Đổi quốc gia</button>
        <button class="btn small" type="button" data-action="edit-age">🎂 Đổi tuổi</button>
      </div>
      <div id="pf-grid" class="stat-grid"></div>
    </section>

    <!-- THỐNG KÊ -->
    <section class="screen" id="screen-stats" aria-label="Thống kê">
      <div id="stats-grid" class="stat-grid"></div>
      <h3 class="sub">Theo từng game</h3>
      <div id="stats-games" class="table-rows"></div>
    </section>

    <!-- THÀNH TÍCH -->
    <section class="screen" id="screen-achievements" aria-label="Thành tích">
      <p id="ach-count" class="muted center"></p>
      <div id="ach-list" class="ach-list"></div>
    </section>

    <!-- CÀI ĐẶT -->
    <section class="screen" id="screen-settings" aria-label="Cài đặt">
      <div id="settings-body" class="settings"></div>
    </section>

    <!-- HƯỚNG DẪN -->
    <section class="screen" id="screen-guide" aria-label="Hướng dẫn">
      <div id="guide-body" class="guide"></div>
    </section>
  </main>

  <nav id="bottomnav" aria-label="Điều hướng">
    <button type="button" data-action="goto" data-target="home" data-t="home"><span>🏠</span>Trang chủ</button>
    <button type="button" data-action="goto" data-target="games"><span>🎴</span>Game</button>
    <button type="button" data-action="goto" data-target="profile"><span>👤</span>Hồ sơ</button>
    <button type="button" data-action="goto" data-target="stats"><span>📊</span>Thống kê</button>
    <button type="button" data-action="goto" data-target="settings"><span>⚙️</span>Cài đặt</button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="fx-root" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
